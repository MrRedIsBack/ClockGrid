[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clockgrid"
version = "0.1.0"
description = "Multiple clocks on a grid so you can keep track of your weekly goals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.gui-scripts]
clockgrid = "clockgrid.app:main"

[tool.setuptools.packages.find]
include = ["clockgrid*"]

[tool.setuptools.package-data]
clockgrid = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
